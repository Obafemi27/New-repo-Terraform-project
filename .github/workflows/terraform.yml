name: Terraform CI/CD

on:
  pull_request:
    branches:
      - dev
      - prod
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to target
        required: true
        type: choice
        options:
          - dev
          - prod
      operation:
        description: Terraform operation to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  target:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ENVIRONMENT: ${{ inputs.target_environment }}
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            environment="$MANUAL_ENVIRONMENT"
          else
            case "$TARGET_BRANCH" in
              dev)  environment="dev" ;;
              prod) environment="prod" ;;
              *)
                echo "Unsupported target branch: $TARGET_BRANCH" >&2
                exit 1
                ;;
            esac
          fi

          echo "environment=$environment" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate (${{ needs.target.outputs.environment }})
    needs: target
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote state
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

  manual_terraform:
    name: ${{ inputs.operation }} (${{ needs.target.outputs.environment }})
    if: github.event_name == 'workflow_dispatch'
    needs:
      - target
      - validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.target.outputs.environment }}
    concurrency:
      group: terraform-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: environments/${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Initialize S3 state backend
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          TARGET_ENVIRONMENT: ${{ needs.target.outputs.environment }}
        run: |
          case "$TARGET_ENVIRONMENT" in
            dev)  TF_STATE_BUCKET="amzn-s3-class-bucket2222" ;;
            prod) TF_STATE_BUCKET="amzn-s3-class-bucket3333" ;;
            *)
              echo "Unsupported target environment: $TARGET_ENVIRONMENT" >&2
              exit 1
              ;;
          esac

          terraform init -reconfigure -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=ec2/$TARGET_ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      - name: Create execution plan
        env:
          OPERATION: ${{ inputs.operation }}
          TFVARS_FILE: ${{ needs.target.outputs.environment }}.tfvars
        run: |
          if [ "$OPERATION" = "destroy" ]; then
            terraform plan -destroy -input=false -no-color -var-file="$TFVARS_FILE" -out=tfplan
          else
            terraform plan -input=false -no-color -var-file="$TFVARS_FILE" -out=tfplan
          fi

      - name: Apply saved plan
        if: inputs.operation == 'apply' || inputs.operation == 'destroy'
        run: terraform apply -input=false -auto-approve tfplan
